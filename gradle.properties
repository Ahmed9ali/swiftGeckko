org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# GeckoView: "+" = newest release on maven.mozilla.org. After the first successful build, pin it
# (e.g. geckoVersion=142.0.20250805000000) so engine updates never break the build unexpectedly.
geckoVersion=+
geckoArtifact=geckoview
# ABIs packed into the APK (comma separated). arm64-v8a = nearly all phones from the last 8 years.
abis=arm64-v8a
