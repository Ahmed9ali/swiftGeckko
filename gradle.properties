# Location: <project-root>/gradle.properties
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# GeckoView: pinned to a concrete stable release.
# Do NOT use "+" — dynamic resolution pulls new GeckoView builds that raise
# the AAR metadata floor and break :app:checkDebugAarMetadata unexpectedly.
geckoVersion=149.0.20260403140140
geckoArtifact=geckoview

# ABIs packed into the APK (comma separated). arm64-v8a = nearly all phones from the last 8 years.
abis=arm64-v8a